name: lazyclaw_mobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.22.0+110

environment:
  sdk: ^3.11.4

# Native build-hook config. llamadart bundles BOTH a llama.cpp runtime (for GGUF)
# AND a LiteRT-LM runtime (for .litertlm models) by default. LiteRT-LM is
# Java/MediaPipe-based — it pulls the `jni` package whose startup JNI init
# null-derefs `FindClass` on this device (SIGSEGV at launch). We only run GGUF,
# so restrict to llama_cpp: fixes the startup crash AND drops ~54 MB of unused
# LiteRT-LM .so from the APK.
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
      # CPU-only: drop the 48 MB libggml-vulkan.so. We never use the GPU
      # backend (engine pins GpuBackend.cpu), AND ggml-vulkan creating a
      # VkInstance when its .so is dlopen'd at startup conflicts with Flutter's
      # Impeller/Vulkan renderer on Adreno → black screen / no first frame.
      # Dropping it fixes the black screen and shrinks the APK ~48 MB.
      llamadart_native_backends:
        platforms:
          android-arm64:
            backends: [cpu]

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # Required by flutter_quill's editor/toolbar localizations (Global*Localizations).
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  web_socket_channel: ^3.0.1
  flutter_markdown: ^0.7.4
  lucide_icons: ^0.257.0
  # Subtle list-entrance motion (declarative, finite). Used on the Tasks list.
  flutter_animate: ^4.5.0
  # Month calendar for the Tasks tab (List⇄Calendar toggle). Per-project-colored
  # event markers keyed by task due date.
  table_calendar: ^3.1.0
  flutter_local_notifications: ^18.0.0
  # Inline playback of inbox voice notes / audio (BytesSource — bytes come
  # from the authenticated /api/inbox media endpoint, never a raw URL).
  audioplayers: ^6.1.0
  # Scheduled task reminders need a tz-aware clock for zonedSchedule. `timezone`
  # is already pulled in transitively by flutter_local_notifications; promoting
  # it to a direct dep lets us call tz.* ourselves. `flutter_timezone` resolves
  # the device's IANA zone name so the local location is correct.
  timezone: ^0.10.0
  flutter_timezone: ^4.0.0
  # Offline-first Tasks layer: encrypted local SQLite, reachability, bg sync.
  sqflite_sqlcipher: ^3.1.0
  connectivity_plus: ^6.1.0
  workmanager: ^0.7.0
  path: ^1.9.0
  # In-app APK self-updater: download + sha256 verify + launch installer.
  ota_update: ^7.1.0
  # Real running version/build (PackageInfo); kAppVersion/kAppBuild = fallback.
  # Pinned to ^9.0.1 (not ^10.x): package_info_plus 10 needs win32 ^6, which
  # conflicts with flutter_secure_storage 9.2.2's win32 ^5 pin. v9 is the
  # nearest compatible release and is API-identical for our usage.
  package_info_plus: ^9.0.1
  # Documents tab: PDF rendering (MIT — pdfium-backed). License discipline
  # (CLAUDE.md): permissive only, never Syncfusion/AGPL.
  pdfx: ^2.9.2
  # Documents tab: native file chooser for importing files (MIT).
  file_picker: ^11.0.0
  # Documents tab: export/share — fetch the rendered file (xlsx/csv/docx/pdf)
  # via the authed Dio client, write a temp file, hand it to the OS share sheet
  # (Save to Files / Drive / send). Permissive (BSD-3).
  share_plus: ^10.1.4
  # Documents tab: native rich-text editor (MIT). Bold/italic/underline,
  # headings, bullet & numbered lists, links — round-tripped to the Univer
  # IDocumentData snapshot via univer_quill.dart. License discipline (CLAUDE.md):
  # permissive only.
  flutter_quill: ^11.0.0
  # Home-screen access (Phase 5): app-icon long-press quick actions + a native
  # Quick-Capture home-screen widget. Permissive only (CLAUDE.md): both BSD-3.
  quick_actions: ^1.1.0
  home_widget: ^0.9.0
  # Sheet hyperlinks: launch URLs from the link chip. BSD-3.
  url_launcher: ^6.3.0
  # On-device local LLM: runs Qwen3-4B / Phi-4-mini Q4_K_M GGUF on the phone via
  # a bundled prebuilt llama.cpp (arm64-v8a). Loads a model from an absolute file
  # path we push over USB, auto-applies the GGUF's chat template, streams tokens.
  # MIT — license discipline (CLAUDE.md): permissive only, same llama.cpp engine
  # as the on-device keyboard so both read the identical GGUF.
  llamadart: ^0.8.5
  # Lazy Assistant voice I/O — platform SpeechRecognizer (on-device) + TextToSpeech.
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device integration test: proves llamadart loads a pushed GGUF and
  # generates on real hardware (run with `flutter test integration_test -d <id>`).
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  sqflite_common_ffi: ^2.3.0
  fake_async: ^1.3.1

# Launcher icon: LazyClaw claw-mark, generated via `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/lazyclaw_icon.png"
  adaptive_icon_background: "#0d0d0d"
  adaptive_icon_foreground: "assets/icon/lazyclaw_icon.png"
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Sheets formula helper catalog (function name + signature + one-line help).
  assets:
    - assets/sheets/formula_catalog.json

  # Bundled fonts (offline-first — no runtime fetch).
  # Inter (SIL Open Font License 1.1) ships as the upstream variable .ttf which
  # exposes the full weight axis (Thin→Black). Flutter maps a requested
  # FontWeight onto the `wght` axis, so Regular/Medium/SemiBold/Bold all resolve
  # from this single file. See assets/fonts/OFL.txt for the licence.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
