[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-email"
version = "0.1.0"
description = "Email MCP server — send/read/search email via SMTP+IMAP. Works with Gmail, Outlook, any provider."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "mcp>=1.0.0,<2",
    "aiosmtplib>=3.0.0",
    # IMAP uses the stdlib `imaplib` (PSF, permissive) via asyncio.to_thread —
    # deliberately NOT aioimaplib, which is GPL-3.0 and would poison this MIT
    # project the moment the Docker image ships it. See tests/test_license_gate.py.
]
