[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-scraper"
version = "0.1.0"
description = "Self-hosted scraper MCP — vendored crawl4ai + FastMCP wrapper. JS-rendered crawl, entity extraction, file→markdown."
requires-python = ">=3.11"
license = {text = "MIT AND Apache-2.0"}
readme = "README.md"

# Dependencies are the union of:
#  - walksoda/crawl-mcp wrapper deps (FastMCP + processors + youtube/google)
#  - unclecode/crawl4ai 0.7.8 runtime deps (vendored — must list its deps)
# crawl4ai itself is NOT a dep here — its source lives in mcp_scraper/_vendor/.
dependencies = [
    # MCP transport
    "mcp>=1.0.0,<2",
    "fastmcp>=2.14.2",

    # Wrapper (FastMCP server) deps
    "pydantic>=2.10",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0,<3",
    "markitdown==0.1.3",
    "pdfminer.six==20250506",
    "mammoth>=1.9.1",
    "openpyxl>=3.1.5",
    "python-pptx==1.0.2",
    "xlrd>=2.0.1",
    "googlesearch-python==1.3.0",
    "aiohttp>=3.11.11",
    "beautifulsoup4>=4.12",
    "youtube-transcript-api==1.2.3",
    "youtube-comment-downloader==0.1.78",
    "playwright==1.55.0",
    "python-dateutil>=2.9.0.post0",
    "tiktoken>=0.5.0",
    "typing-extensions",

    # Vendored crawl4ai 0.7.8 runtime deps (see _vendor/crawl4ai/)
    "aiofiles>=24.1.0",
    "aiosqlite~=0.20",
    "anyio>=4.0.0",
    "lxml~=5.3",
    "unclecode-litellm==1.81.13",
    "pillow>=10.4",
    "patchright>=1.49.0",
    "requests~=2.26",
    "playwright-stealth>=2.0.0",
    "xxhash~=3.4",
    "rank-bm25~=0.2",
    "snowballstemmer~=2.2",
    "pyOpenSSL>=25.3.0",
    "psutil>=6.1.1",
    "PyYAML>=6.0",
    "nltk>=3.9.1",
    "rich>=13.9.4",
    "cssselect>=1.2.0",
    "httpx[http2]>=0.27.2",
    "fake-useragent>=2.0.3",
    "click>=8.1.7",
    "chardet>=5.2.0",
    "brotli>=1.1.0",
    "humanize>=4.10.0",
    "lark>=1.2.2",
    "alphashape>=1.3.1",
    "shapely>=2.0.0",
    "pypdf",
]

[project.optional-dependencies]
# TLS-fingerprint impersonation for `stealth_http.stealth_get` — bypasses
# JA3/JA4 fingerprint blocks on Cloudflare-protected sites that reject
# plain httpx at the TLS layer before any HTML is served. ~5 MB compiled
# extension. When missing, `stealth_http` silently falls back to httpx.
stealth = ["curl_cffi>=0.7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_scraper*"]

[tool.setuptools.package-data]
mcp_scraper = ["**/*.js", "**/*.json", "**/*.md", "**/*.txt", "**/*.yaml", "**/*.html"]

[project.scripts]
mcp-scraper = "mcp_scraper.server:main"
