[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-apihunter"
version = "0.2.0"
description = "Admin-panel-to-API bridge — MCP server that replays a web admin panel's endpoints as durable API tools"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "mcp>=1.0.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "cryptography>=42.0.0",
    "websockets>=12.0",
]

[project.scripts]
mcp-apihunter = "mcp_apihunter.main:main"

[tool.setuptools.packages.find]
include = ["mcp_apihunter*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
