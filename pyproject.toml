[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lazyclaw"
version = "0.2.0"
description = "E2E Encrypted AI Agent Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.5.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    # Official Anthropic Claude Agent SDK — drives MODE_CLAUDE's "sdk"
    # transport (native tool_use protocol + persistent client + cost
    # reporting). Shells out to the local `claude` binary, same auth path
    # as the legacy CLI transport. Base dep (default-on per
    # feedback_optional_extras_for_core_features).
    "claude-agent-sdk>=0.1.81",
    "python-multipart>=0.0.7",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "python-telegram-bot>=21.0",
    "ddgs>=9.0.0",
    "bcrypt>=4.0.0",
    "croniter>=1.3.0",
    "prompt_toolkit>=3.0.0",
    "textual>=0.50.0",
    "mcp>=1.0.0",
    # Google Workspace MCP server (Sheets / Drive / Gmail / Calendar / Docs).
    # Installed inside the container so it's launchable as `workspace-mcp`
    # via the Web UI's MCP → Add Server flow. See ADR-0003.
    "workspace-mcp>=1.19.0,<1.21.0",
    # Python wrapper for the Tesseract OCR binary. The wrapper is tiny and
    # always installs; the binary itself is opt-in via `brew install tesseract`
    # (or `apt install tesseract-ocr`). When missing, the `browser(action="ocr")`
    # action returns a structured [dependency_missing] error that tells the
    # agent to fall back to `ask_vision` — OCR is a cheap optimisation, not
    # a correctness requirement.
    "pytesseract>=0.3.10",
    # LazyBrain Phase E — Aho-Corasick auto-link suggester. Tiny C extension
    # (~50 KB wheel); when import fails the autolink path falls back to the
    # legacy substring scanner so install isn't a hard requirement.
    "pyahocorasick>=2.0.0",
    # Speech-to-text for voice messages (Telegram voice notes + Web UI mic).
    # whisper.cpp via pywhispercpp — MIT, ~244 MB `small` model, Metal + CoreML
    # ANE acceleration on Apple Silicon, 99 languages incl. Georgian.
    # imageio-ffmpeg bundles a static ffmpeg binary (BSD-2-Clause) so users
    # don't have to `brew install ffmpeg` separately — stt.py prefers the
    # bundled binary, falls back to system PATH if it's missing.
    # Both are base deps (not optional) since voice is a first-class channel:
    # Telegram voice notes + Web UI mic both fail-closed without them.
    # stt.py keeps a graceful ImportError fallback for platforms where
    # pywhispercpp wheels are missing and source builds aren't available.
    "pywhispercpp>=1.2.0",
    "imageio-ffmpeg>=0.4.9",
    # sqlite-vec — vec0 virtual table for LazyBrain semantic search.
    # Replaces the brute-force NumPy cosine pass over per-user decrypted
    # vectors with a single SQL nearest-neighbour query (~50ms at 100k
    # vectors vs 600-1200ms at 5k for the old loop). Plaintext mirror only —
    # the encrypted `note_embeddings` table remains the source of truth.
    # When the extension fails to load (locked-down sqlite, missing
    # loadable extensions, sandboxed host), embeddings.py degrades to
    # the brute-force path with identical recall quality. Base dep
    # (default-on per feedback_optional_extras_for_core_features).
    "sqlite-vec>=0.1.9",
    # Sheets feature — read/write .xlsx server-side (the Univer web editor's
    # xlsx import/export is Pro-gated, so we convert snapshot⇄xlsx in Python
    # instead). openpyxl (MIT) writes+re-edits and preserves formulas as
    # text; python-calamine (MIT) is the fast read path; xlcalculator (MIT)
    # evaluates formulas server-side for cells the agent edits without a
    # browser recalc pass. All permissively licensed — deliberately NOT
    # HyperFormula/Handsontable (GPL/commercial) or `formulas`/`pycel`
    # (EUPL/GPL). Base deps (default-on per
    # feedback_optional_extras_for_core_features).
    "openpyxl>=3.1.0",
    "python-calamine>=0.2.3",
    "xlcalculator>=0.5.0",
]

[project.optional-dependencies]
telegram = []
discord = ["discord.py>=2.3.0"]
eco = []
# Kept as empty no-op alias — `pip install lazyclaw[voice]` still works for
# back-compat with the pre-2026-05-10 install instructions and any external
# scripts. Real deps moved to base above.
voice = []
local = ["llama-cpp-python>=0.2.0"]
# Apple Vision OCR for browser screenshots — macOS-only. Pulls in the
# pyobjc Vision framework binding. `browser(action="ask_vision")` and
# `browser(action="ocr")` use this when available; both fall back to
# Tesseract on Linux/Windows so this remains optional.
mac = ["ocrmac>=1.0.1; sys_platform == 'darwin'"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# LazyBrain Phase I — Leiden community detection on the galaxy graph.
# When unavailable (e.g. install failure on exotic platforms) the graph
# endpoint silently falls back to tag-based coloring.
graph = ["python-igraph>=0.11", "leidenalg>=0.10"]
# LazyBrain Phase K — BGE cross-encoder reranker for /ask. ~280 MB model
# downloads on first call; gated behind `lazybrain.reranker_enabled`.
rerank = ["rerankers>=0.3.0"]
all = ["lazyclaw[telegram,discord,voice,eco,mac,dev,graph]"]

[project.scripts]
lazyclaw = "lazyclaw.cli:main"
lazyclaw-migrate-brain = "lazyclaw.cli_migrate_lazybrain:main"

[tool.setuptools.packages.find]
include = ["lazyclaw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
